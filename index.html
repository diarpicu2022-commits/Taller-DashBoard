<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Taller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tokens.js"></script>
<style>
  html, body { font-family: 'Poppins', system-ui, sans-serif; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>

<body class="bg-panel text-ink p-8">

  <p class="text-label text-muted uppercase tracking-wide mb-4">Paso 2 de 6 · Tarjeta KPI</p>

  <!-- ===================================================================
       TARJETAS KPI
       Componente que carga la decision dominante: "¿requiere mi atencion
       algo hoy?". Icono en circulo lavanda + etiqueta + cifra + delta.
       =================================================================== -->
  <section aria-label="Indicadores principales"
           class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 max-w-[1100px]">

    <!-- Total Sales -->
    <article class="bg-surface rounded-card shadow-card px-7 py-6 flex items-center gap-5">
      <span class="grid place-items-center w-14 h-14 rounded-icon bg-primary-soft shrink-0" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" class="text-primary">
          <path d="M2.5 3h1.6a1 1 0 0 1 .98.8L5.4 6m0 0 1.5 7.2a1.6 1.6 0 0 0 1.57 1.3h7.9a1.6 1.6 0 0 0 1.56-1.25L19.4 7.3A1 1 0 0 0 18.42 6H5.4Z"
                stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="9" cy="19.2" r="1.7" fill="currentColor"/>
          <circle cx="16.4" cy="19.2" r="1.7" fill="currentColor"/>
        </svg>
      </span>
      <div class="min-w-0">
        <p class="text-[15px] leading-5 text-muted">Total Sales</p>
        <p class="flex items-baseline gap-3 mt-0.5">
          <span class="text-kpi tracking-tight">263k</span>
          <span class="text-[13px] font-medium text-success whitespace-nowrap">
            <span aria-hidden="true" class="inline-block mr-0.5">&uarr;</span>15.6%
            <span class="sr-only">, sube 15,6 por ciento</span>
          </span>
        </p>
      </div>
    </article>

    <!-- Total Visitors -->
    <article class="bg-surface rounded-card shadow-card px-7 py-6 flex items-center gap-5">
      <span class="grid place-items-center w-14 h-14 rounded-icon bg-primary-soft shrink-0" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" class="text-primary">
          <circle cx="9" cy="8" r="3.1"/>
          <path d="M3.2 18.4c0-2.9 2.6-4.6 5.8-4.6s5.8 1.7 5.8 4.6a.9.9 0 0 1-.9.9H4.1a.9.9 0 0 1-.9-.9Z"/>
          <circle cx="17.2" cy="9.2" r="2.4" opacity=".55"/>
          <path d="M16.4 13.6c2.5.1 4.4 1.6 4.4 3.9a.8.8 0 0 1-.8.8h-3.1c.2-.5.3-1 .3-1.6 0-1.2-.3-2.2-.8-3.1Z" opacity=".55"/>
        </svg>
      </span>
      <div class="min-w-0">
        <p class="text-[15px] leading-5 text-muted">Total Visitors</p>
        <p class="flex items-baseline gap-3 mt-0.5">
          <span class="text-kpi tracking-tight">35k</span>
          <span class="text-[13px] font-medium text-danger whitespace-nowrap">
            <span aria-hidden="true" class="inline-block mr-0.5">&darr;</span>6.2%
            <span class="sr-only">, baja 6,2 por ciento</span>
          </span>
        </p>
      </div>
    </article>

    <!-- Total Orders -->
    <article class="bg-surface rounded-card shadow-card px-7 py-6 flex items-center gap-5">
      <span class="grid place-items-center w-14 h-14 rounded-icon bg-primary-soft shrink-0" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" class="text-primary">
          <path d="M4.6 8.4h14.8l-1 11.1a1.6 1.6 0 0 1-1.6 1.5H7.2a1.6 1.6 0 0 1-1.6-1.5L4.6 8.4Z" fill="currentColor"/>
          <path d="M8.7 9.5V6.9a3.3 3.3 0 0 1 6.6 0v2.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
          <circle cx="12" cy="14.2" r="1.5" fill="#EAE9FE"/>
        </svg>
      </span>
      <div class="min-w-0">
        <p class="text-[15px] leading-5 text-muted">Total Orders</p>
        <p class="flex items-baseline gap-3 mt-0.5">
          <span class="text-kpi tracking-tight">165k</span>
          <span class="text-[13px] font-medium text-success whitespace-nowrap">
            <span aria-hidden="true" class="inline-block mr-0.5">&uarr;</span>3.5%
            <span class="sr-only">, sube 3,5 por ciento</span>
          </span>
        </p>
      </div>
    </article>

  </section>

  <p class="text-label text-muted-soft mt-8">
    Paso siguiente — 3 de 6: el esqueleto (contenedor, sidebar y barra superior).
  </p>

</body>
</html>
